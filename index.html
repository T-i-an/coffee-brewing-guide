<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手冲咖啡指南</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>手冲咖啡指南</h1>
            <p>探索手冲咖啡的奥秘，从入门到精通</p>
        </header>

        <main>
            <section class="features">
                <div class="feature">
                    <div class="feature-image">
                        <img src="images/preheat-brewer.jpg" alt="温杯">
                    </div>
                    <div class="feature-content">
                        <h2>温杯</h2>
                        <p>学习如何正确预热咖啡器具，确保最佳萃取温度</p>
                    </div>
                </div>
                <div class="feature">
                    <div class="feature-image">
                        <img src="images/hand-grinder.JPG" alt="磨豆">
                    </div>
                    <div class="feature-content">
                        <h2>磨豆</h2>
                        <p>掌握咖啡豆研磨技巧，获得理想的咖啡粉</p>
                    </div>
                </div>
                <div class="feature">
                    <div class="feature-image">
                        <img src="images/pour.jpg" alt="注水">
                    </div>
                    <div class="feature-content">
                        <h2>注水</h2>
                        <p>学习三段式注水技巧，实现完美萃取</p>
                    </div>
                </div>
                <div class="feature">
                    <div class="feature-image">
                        <img src="images/serve.jpg" alt="出品">
                    </div>
                    <div class="feature-content">
                        <h2>出品</h2>
                        <p>了解如何正确品尝和评价手冲咖啡</p>
                    </div>
                </div>
            </section>

            <section class="benefits">
                <h2>为什么选择手冲咖啡？</h2>
                <ul>
                    <li>完全掌控咖啡的萃取过程</li>
                    <li>体验不同咖啡豆的独特风味</li>
                    <li>享受制作咖啡的乐趣</li>
                    <li>提升咖啡品鉴能力</li>
                </ul>
            </section>

            <section class="cta">
                <a href="guide.html" class="cta-button">开始学习</a>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
