<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温杯指南 - 手冲咖啡指南</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="landing-page">
        <!-- 顶部导航栏 -->
        <nav class="main-nav">
            <div class="nav-logo">
                <i class="fas fa-coffee"></i>
                <span>手冲咖啡指南</span>
            </div>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="preheat.html">温杯指南</a>
                <a href="brewing.html">冲泡指南</a>
                <a href="records.html">冲泡记录</a>
                <a href="about.html">关于我们</a>
            </div>
        </nav>

        <!-- 主要内容区 -->
        <main class="main-content">
            <div class="title-section">
                <h1>温杯指南</h1>
                <p class="subtitle">掌握正确的温杯步骤，提升咖啡品质</p>
            </div>

            <!-- 温杯步骤交互区 -->
            <div class="preheat-container">
                <div class="preheat-demo">
                    <div class="demo-title">
                        <h2>温杯步骤演示</h2>
                    </div>
                    <div class="demo-steps">
                        <div class="demo-step">
                            <div class="step-icon">
                                <i class="fas fa-hand-paper"></i>
                            </div>
                            <div class="step-text">
                                <h3>步骤一：准备滤纸</h3>
                                <p>将滤纸折叠成锥形</p>
                            </div>
                        </div>
                        <div class="demo-step">
                            <div class="step-icon">
                                <i class="fas fa-tint"></i>
                            </div>
                            <div class="step-text">
                                <h3>步骤二：冲洗滤纸</h3>
                                <p>用热水冲洗滤纸，去除纸味</p>
                            </div>
                        </div>
                        <div class="demo-step">
                            <div class="step-icon">
                                <i class="fas fa-mug-hot"></i>
                            </div>
                            <div class="step-text">
                                <h3>步骤三：预热滤杯</h3>
                                <p>将热水倒入滤杯，预热器具</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="preheat-interactive">
                    <div class="filter-paper">
                        <i class="fas fa-hand-paper"></i>
                    </div>
                    <div class="filter-cup">
                        <i class="fas fa-mug-hot"></i>
                    </div>
                    <div class="completion-message">
                        <i class="fas fa-check-circle"></i>
                        <span>温杯完成！</span>
                    </div>
                </div>

                <div class="preheat-showcase">
                    <div class="showcase-title">
                        <h2>温杯小贴士</h2>
                    </div>
                    <div class="showcase-items">
                        <div class="showcase-item">
                            <div class="item-icon">
                                <i class="fas fa-thermometer-half"></i>
                            </div>
                            <div class="item-text">
                                <h3>水温控制</h3>
                                <p>使用90-95°C的热水进行温杯</p>
                            </div>
                        </div>
                        <div class="showcase-item">
                            <div class="item-icon">
                                <i class="fas fa-clock"></i>
                            </div>
                            <div class="item-text">
                                <h3>时间控制</h3>
                                <p>温杯时间约30秒</p>
                            </div>
                        </div>
                        <div class="showcase-item">
                            <div class="item-icon">
                                <i class="fas fa-info-circle"></i>
                            </div>
                            <div class="item-text">
                                <h3>注意事项</h3>
                                <p>确保所有器具都充分预热</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 导航按钮 -->
            <div class="nav-buttons">
                <a href="index.html" class="nav-btn">
                    <i class="fas fa-arrow-left"></i>
                    <span>返回首页</span>
                </a>
                <a href="brewing.html" class="nav-btn">
                    <span>下一步：冲泡指南</span>
                    <i class="fas fa-arrow-right"></i>
                </a>
            </div>
        </main>

        <!-- 底部信息 -->
        <footer class="main-footer">
            <p>© 2024 手冲咖啡指南 | 探索咖啡的无限可能</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
